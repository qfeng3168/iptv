name: build-ipk
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            sdk_image: ghcr.io/openwrt/sdk:x86-64-openwrt-23.05
          - name: armsr-armv8
            sdk_image: ghcr.io/openwrt/sdk:armsr-armv8-openwrt-23.05
          - name: mt7621
            sdk_image: ghcr.io/openwrt/sdk:ramips-mt7621-openwrt-23.05
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build in OpenWrt SDK
        run: |
          docker run --rm -v "$PWD:/feed" ${{ matrix.sdk_image }} /bin/bash -exc '
            cd /builder
            # 喂入依赖源码索引
            ./scripts/feeds update -a
            ./scripts/feeds install libstdcpp
            rm -rf package/iptv-helper
            mkdir -p package
            cp -r /feed package/iptv-helper
            make defconfig
            echo "CONFIG_PACKAGE_libstdcpp=m" >> .config
            make defconfig
            make package/iptv-helper/compile V=s -j$(nproc)
            mkdir -p /feed/out
            find bin/packages -name "iptv-helper*.ipk" -exec cp {} /feed/out/ \;
          '

      - name: Upload ipk
        uses: actions/upload-artifact@v4
        with:
          name: iptv-helper-${{ matrix.name }}
          path: out/*.ipk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true, path: out }
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.ipk
