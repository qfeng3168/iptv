name: build-ipk
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

env:
  OW_RELEASE: 23.05.5

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            target_path: targets/x86/64
          - name: armsr-armv8
            target_path: targets/armsr/armv8
          - name: aarch64_cortex-a53
            target_path: targets/sunxi/cortexa53
          - name: mt7621
            target_path: targets/ramips/mt7621
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download OpenWrt SDK
        run: |
          BASE="https://downloads.openwrt.org/releases/${{ env.OW_RELEASE }}/${{ matrix.target_path }}"
          SDK=$(curl -s "$BASE/" | grep -o 'openwrt-sdk-[^"]*Linux-x86_64\.tar\.xz' | head -1)
          echo "SDK file: $SDK"
          curl -fsSL "$BASE/$SDK" -o sdk.tar.xz
          tar -xf sdk.tar.xz
          mv openwrt-sdk-* sdk

      - name: Build ipk
        run: |
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install libstdcpp
          rm -rf package/iptv-helper
          mkdir -p package/iptv-helper
          for f in Makefile src files luci; do cp -r "$GITHUB_WORKSPACE/$f" package/iptv-helper/; done
          make defconfig
          echo "CONFIG_PACKAGE_libstdcpp=m" >> .config
          make defconfig
          make package/iptv-helper/compile V=s -j$(nproc)
          mkdir -p $GITHUB_WORKSPACE/out
          find bin/packages -name "*iptv-helper*.ipk" -exec cp {} $GITHUB_WORKSPACE/out/ \;

      - name: Upload ipk
        uses: actions/upload-artifact@v4
        with:
          name: iptv-helper-${{ matrix.name }}
          path: out/*.ipk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true, path: out }
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.ipk
